# 公共配置文件

spring:
  application:
    name: salary-leap
  # 默认 dev 环境
  profiles:
    active: dev
  # session 配置
  session:
    # todo 取消注释开启分布式 session（须先配置 Redis）
    # store-type: redis
    # 30 天过期
    timeout: 2592000
  # 数据库配置
  # todo 需替换配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/salary_leap
    username: root
    password: root
  # Redis 配置（邮箱注册验证码使用）
  data:
    redis:
      host: 127.0.0.1
      port: 6379
  # 邮件配置（发送邮箱注册验证码）
  # todo 需替换为自己的 SMTP 账号
  mail:
    host: smtp.qq.com
    port: 587
    username: your_email@qq.com
    password: your_auth_code
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  # Elasticsearch 配置
  # todo 需替换配置，然后取消注释
#  elasticsearch:
#    uris: http://localhost:9200
#    username: root
#    password: 123456
  # 文件上传
  servlet:
    multipart:
      # 大小限制
      max-file-size: 10MB
server:
  address: 0.0.0.0
  port: 8101
  servlet:
    context-path: /api
    # cookie 30 天过期
    session:
      cookie:
        max-age: 159200
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDelete # 全局逻辑删除的实体字段名
      logic-delete-value: 1 # 逻辑已删除值（默认为 1）
      logic-not-delete-value: 0 # 逻辑未删除值（默认为 0）
# 微信相关
wx:
  # 微信公众平台
  # todo 需替换配置
  mp:
    token: xxx
    aesKey: xxx
    appId: xxx
    secret: xxx
    config-storage:
      http-client-type: HttpClient
      key-prefix: wx
      redis:
        host: 127.0.0.1
        port: 6379
      type: Memory
  # 微信开放平台
  # todo 需替换配置
  open:
    appId: xxx
    appSecret: xxx
# 接口文档配置（knife4j 基于 springdoc）
springdoc:
  info:
    title: salary_leap API
    description: salary_leap 后端接口文档
    version: 1.0
    contact:
      name: XiaoHua
      url: https://github.com/xiaoHua-71
      email: 2035346428@qq.com
knife4j:
  enable: true
# LangChain4j 通义千问（阿里云百炼）配置
# base-url 为专属实例（独占部署）的 DashScope 原生地址，默认走 https://dashscope.aliyuncs.com/api/v1
langchain4j:
  community:
    dashscope:
      chat-model:
        api-key:
        base-url: https://ws-xupotu1vk2yorol6.cn-beijing.maas.aliyuncs.com/api/v1
        model-name: qwen3.7-max
# Milvus 向量库配置（langchain4j-milvus 无 starter，自行用 @Value 读取）
milvus:
  host: localhost
  port: 19530
  collection-name: level_knowledge
  dimension: 1536
# RAG 检索配置
rag:
  retrieve:
    top-k: 3            # 最终交给大模型的片段数
  rerank:
    enabled: true       # 是否开启 rerank 精排
    recall: 20          # 向量检索先召回多少条候选，供 rerank 精排
    model: gte-rerank-v2
    base-url: https://dashscope.aliyuncs.com/api/v1
  hybrid:
    enabled: true       # 是否开启混合检索（BM25 关键词 + 向量双路召回）
    recall: 20          # BM25 这一路召回多少条候选
    rrf-k: 60           # RRF 平滑常数，原论文默认 60
    max-candidates: 30  # 融合去重后、送进 rerank 前的候选上限
  # 文档切分参数
  split:
    chunk-size: 500     # 单个知识片段的最大字符数
    overlap: 100        # 相邻片段的重叠字符数
  # 网页文档加载（把真实网页正文抓进知识库）
  web:
    enabled: true         # 是否抓取网页入库
    urls: [https://javaguide.cn/]              # 要抓取的页面列表，一行一个；留空则跳过抓取
    cache-dir: docs/web   # 正文缓存目录（有缓存即复用；删掉缓存文件即重新抓取）
    timeout-ms: 10000
    delay-ms: 500         # 相邻两次抓取的间隔，避免给目标站点压力
    user-agent: Mozilla/5.0 (compatible; salary-leap-rag/1.0)


