# LangChain4j 通义千问（阿里云百炼）配置
# base-url 为专属实例（独占部署）的 DashScope 原生地址，默认走 https://dashscope.aliyuncs.com/api/v1
langchain4j:
  community:
    dashscope:
      chat-model:
        api-key: ${DASHSCOPE_API_KEY}
        base-url: https://ws-xupotu1vk2yorol6.cn-beijing.maas.aliyuncs.com/api/v1
        model-name: qwen3.7-max
# Milvus 向量库配置（langchain4j-milvus 无 starter，自行用 @Value 读取）
milvus:
  host: localhost
  port: 19530
  collection-name: level_knowledge
  dimension: 1536
# RAG 检索配置
rag:
  retrieve:
    top-k: 3            # 最终交给大模型的片段数
    max-per-source: 1   # 同一篇文章**优先**最多占 top-k 里的几个位置（<=0 表示不限制）
                        # 为什么要限制：chunk=500/overlap=100，同篇相邻片段自带 100 字重叠，
                        # 让它占满 top-k 等于把格子浪费在近似重复内容上
                        # 注意是「优先」不是硬限制：候选池里找不到别的来源时会用重复片段补齐，
                        # 宁可有重复也不要少给知识（见 KnowledgeService.selectDiverse）
  rerank:
    enabled: true       # 是否开启 rerank 精排
    recall: 20          # 向量检索先召回多少条候选，供 rerank 精排
    model: gte-rerank-v2
    base-url: https://dashscope.aliyuncs.com/api/v1
  hybrid:
    enabled: true       # 是否开启混合检索（BM25 关键词 + 向量双路召回）
    recall: 20          # BM25 这一路召回多少条候选
    rrf-k: 60           # RRF 平滑常数，原论文默认 60
    max-candidates: 30  # 融合去重后、送进 rerank 前的候选上限
  # 查询改写（把「学习方向」短标签扩展成多条具体主题查询）
  rewrite:
    enabled: true       # 是否开启查询改写
    count: 4            # 最多扩展出几条子查询（不含原查询）
  # 文档切分参数
  split:
    chunk-size: 500     # 单个知识片段的最大字符数
    overlap: 100        # 相邻片段的重叠字符数
  # 网页文档加载（把真实网页正文抓进知识库）
  web:
    enabled: true         # 是否抓取网页入库
    # 要抓取的页面列表，一行一个；留空则跳过抓取。都是文章正文页，不含只有导航的首页。
    # 第一批(27)：Java 基础(14) + Redis(13)
    # 第二批(65)：JVM(10) + 并发(16) + 集合(12) + MySQL(16) + 框架/Spring(11)
    #   补第二批的原因：查询改写生成的子查询问的就是 JVM/并发/集合/Spring/MySQL 这些主题，
    #   而第一批的 java/basis 只有语言基础（泛型、反射、代理…），库里没东西可捞，改写就没收益。
